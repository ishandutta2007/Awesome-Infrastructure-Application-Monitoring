<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d18"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="nodeGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes telemetryWave{0%{stroke-dashoffset:2000}}@keyframes pulseNode{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:1;filter:drop-shadow(0 0 8px #38bdf8)}}@keyframes pulseRing{0%{r:6px;opacity:1}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.15}}@keyframes floatSoft{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.telemetry-line{stroke-dasharray:2000;animation:telemetryWave 12s linear infinite}.telemetry-line-secondary{stroke-dasharray:2000;animation:telemetryWave 16s linear infinite reverse}.pulse-beacon{animation:pulseRing 3s cubic-bezier(.2,.8,.2,1) infinite;transform-origin:center}.node-core{animation:pulseNode 3s ease-in-out infinite;transform-origin:center}.scan-beam{animation:scanline 8s ease-in-out infinite}.float-badge{animation:floatSoft 5s ease-in-out infinite}</style></defs><rect width="1200" height="380" fill="url(#bgGrad)"/><rect width="1200" height="380" fill="url(#grid)"/><rect width="1200" height="80" fill="url(#textGrad)" class="scan-beam" opacity=".08"/><g filter="url(#glow)" opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M -100 290 Q 150 180, 320 260 T 680 220 T 980 280 T 1300 210" class="telemetry-line"/><path fill="none" stroke="#818cf8" stroke-dasharray="10 5" stroke-width="1.8" d="M -100 240 Q 200 320, 450 210 T 800 270 T 1100 190 T 1300 260" class="telemetry-line-secondary"/></g><g id="telemetry-nodes" filter="url(#nodeGlow)"><g transform="translate(180, 275)"><circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-beacon"/><circle cx="0" cy="0" r="5" fill="#38bdf8" class="node-core"/></g><g transform="translate(480, 235)"><circle cx="0" cy="0" r="10" fill="none" stroke="#a855f7" stroke-width="2" class="pulse-beacon" style="animation-delay:1s"/><circle cx="0" cy="0" r="5" fill="#a855f7" class="node-core" style="animation-delay:1s"/></g><g transform="translate(760, 255)"><circle cx="0" cy="0" r="10" fill="none" stroke="#34d399" stroke-width="2" class="pulse-beacon" style="animation-delay:1.8s"/><circle cx="0" cy="0" r="5" fill="#34d399" class="node-core" style="animation-delay:1.8s"/></g><g transform="translate(1040, 230)"><circle cx="0" cy="0" r="10" fill="none" stroke="#fbbf24" stroke-width="2" class="pulse-beacon" style="animation-delay:2.4s"/><circle cx="0" cy="0" r="5" fill="#fbbf24" class="node-core" style="animation-delay:2.4s"/></g></g><g id="foreground-content" style="pointer-events:none"><g class="float-badge" transform="translate(600, 68)"><rect width="420" height="36" x="-210" y="-18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" rx="18"/><circle cx="-185" cy="0" r="4" fill="#38bdf8"/><text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">FULL-STACK OBSERVABILITY &amp; APM ECOSYSTEM</text></g><text x="600" y="152" fill="#fff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Infrastructure &amp; Application Monitoring</text><text x="600" y="196" fill="#cbd5e1" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing=".2" text-anchor="middle">A Curated Guide to Enterprise Observability Platforms &amp; Open-Source Telemetry Stacks</text><g><g transform="translate(600, 318) translate(-390, 0)"><rect width="130" height="28" x="-65" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Metrics</text></g><g transform="translate(600, 318) translate(-235, 0)"><rect width="150" height="28" x="-75" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 Distributed Traces</text></g><g transform="translate(600, 318) translate(-75, 0)"><rect width="130" height="28" x="-65" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📜 Central Logs</text></g><g transform="translate(600, 318) translate(80, 0)"><rect width="140" height="28" x="-70" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🐝 eBPF &amp; APM</text></g><g transform="translate(600, 318) translate(245, 0)"><rect width="150" height="28" x="-75" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#fbbf24" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 AIOps &amp; RCA</text></g><g transform="translate(600, 318) translate(410, 0)"><rect width="140" height="28" x="-70" y="-14" fill="rgba(15, 23, 42, 0.85)" stroke="#f43f5e" stroke-width="1" rx="14"/><text x="0" y="4" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔭 OpenTelemetry</text></g></g></g></svg>