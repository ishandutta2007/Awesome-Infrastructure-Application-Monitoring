<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes telemetryWave {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes pulseRing {
        0% { r: 6px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .telemetry-line {
        stroke-dasharray: 2000;
        animation: telemetryWave 12s linear infinite;
      }
      .telemetry-line-secondary {
        stroke-dasharray: 2000;
        animation: telemetryWave 16s linear infinite reverse;
      }
      .pulse-beacon {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }
      .node-core {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }
      .scan-beam {
        animation: scanline 8s ease-in-out infinite;
      }
      .float-badge {
        animation: floatSoft 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Animated Ambient Scanning Beam -->
  <rect class="scan-beam" width="1200" height="80" fill="url(#textGrad)" opacity="0.08" />

  <!-- Background Dynamic Telemetry Stream Lines -->
  <g opacity="0.45" filter="url(#glow)">
    <!-- Primary Wave -->
    <path class="telemetry-line" d="M -100 290 Q 150 180, 320 260 T 680 220 T 980 280 T 1300 210" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Secondary Wave -->
    <path class="telemetry-line-secondary" d="M -100 240 Q 200 320, 450 210 T 800 270 T 1100 190 T 1300 260" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="10 5" />
  </g>

  <!-- Telemetry Nodes (Animated Beacons) -->
  <g id="telemetry-nodes" filter="url(#nodeGlow)">
    <!-- Node 1 (Metrics) -->
    <g transform="translate(180, 275)">
      <circle class="pulse-beacon" cx="0" cy="0" r="10" stroke="#38bdf8" stroke-width="2" fill="none" />
      <circle class="node-core" cx="0" cy="0" r="5" fill="#38bdf8" />
    </g>
    <!-- Node 2 (Traces) -->
    <g transform="translate(480, 235)">
      <circle class="pulse-beacon" cx="0" cy="0" r="10" stroke="#a855f7" stroke-width="2" fill="none" style="animation-delay: 1s;" />
      <circle class="node-core" cx="0" cy="0" r="5" fill="#a855f7" style="animation-delay: 1s;" />
    </g>
    <!-- Node 3 (Logs) -->
    <g transform="translate(760, 255)">
      <circle class="pulse-beacon" cx="0" cy="0" r="10" stroke="#34d399" stroke-width="2" fill="none" style="animation-delay: 1.8s;" />
      <circle class="node-core" cx="0" cy="0" r="5" fill="#34d399" style="animation-delay: 1.8s;" />
    </g>
    <!-- Node 4 (APM / Alerts) -->
    <g transform="translate(1040, 230)">
      <circle class="pulse-beacon" cx="0" cy="0" r="10" stroke="#fbbf24" stroke-width="2" fill="none" style="animation-delay: 2.4s;" />
      <circle class="node-core" cx="0" cy="0" r="5" fill="#fbbf24" style="animation-delay: 2.4s;" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Front Layer, No Occlusion) -->
  <g id="foreground-content" style="pointer-events: none;">
    <!-- Eyebrow Category Pill -->
    <g class="float-badge" transform="translate(600, 68)">
      <rect x="-210" y="-18" width="420" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <circle cx="-185" cy="0" r="4" fill="#38bdf8" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2" text-anchor="middle">
        FULL-STACK OBSERVABILITY &amp; APM ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Infrastructure &amp; Application Monitoring
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
      A Curated Guide to Enterprise Observability Platforms &amp; Open-Source Telemetry Stacks
    </text>

    <!-- Capabilities / Tech Badges (Centered) -->
    <g transform="translate(600, 318)">
      <!-- Pill 1: Metrics -->
      <g transform="translate(-390, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Metrics</text>
      </g>
      <!-- Pill 2: Distributed Tracing -->
      <g transform="translate(-235, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔍 Distributed Traces</text>
      </g>
      <!-- Pill 3: Logs -->
      <g transform="translate(-75, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📜 Central Logs</text>
      </g>
      <!-- Pill 4: eBPF APM -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🐝 eBPF &amp; APM</text>
      </g>
      <!-- Pill 5: AIOps & RCA -->
      <g transform="translate(245, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#fbbf24" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🤖 AIOps &amp; RCA</text>
      </g>
      <!-- Pill 6: OpenTelemetry -->
      <g transform="translate(410, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#f43f5e" stroke-width="1" />
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔭 OpenTelemetry</text>
      </g>
    </g>
  </g>
</svg>
